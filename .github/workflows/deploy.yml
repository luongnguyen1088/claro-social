name: Build & Deploy to Dokploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.1devtool/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-dokploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          set -o pipefail
          docker build --progress=plain -f Dockerfile.dev -t ${{ env.IMAGE_NAME }}:latest -t ${{ env.IMAGE_NAME }}:${{ github.sha }} . 2>&1 | tee docker-build.log

      - name: Show failure summary
        if: failure()
        run: |
          echo "## Docker Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 docker-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-log
          path: docker-build.log

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trigger Dokploy Redeploy
        if: success()
        run: |
          echo "Triggering Dokploy redeploy via Webhook..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://do2.claro.vn/api/deploy/compose/X-bpFKlFftcIOYuYDmOKl")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Dokploy webhook returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Dokploy redeploy triggered successfully! ✅"
