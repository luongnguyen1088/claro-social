services:
  postiz-app:
    image: ghcr.io/luongnguyen1088/claro-social:latest
    pull_policy: always
    restart: always
    environment:
      MAIN_URL: https://${POSTIZ_HOST}
      FRONTEND_URL: https://${POSTIZ_HOST}
      NEXT_PUBLIC_BACKEND_URL: https://${POSTIZ_HOST}/api
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://neondb_owner:npg_XIk9FK6qiZNT@ep-delicate-hill-a1ayc57p-pooler.ap-southeast-1.aws.neon.tech/postiz?sslmode=require
      DIRECT_URL: postgresql://neondb_owner:npg_XIk9FK6qiZNT@ep-delicate-hill-a1ayc57p.ap-southeast-1.aws.neon.tech/postiz?sslmode=require
      REDIS_URL: redis://postiz-redis:6379
      BACKEND_INTERNAL_URL: http://127.0.0.1:3000
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      RUN_CRON: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      X_API_KEY: ${X_API_KEY}
      X_API_SECRET: ${X_API_SECRET}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET}
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    depends_on:
      sync-to-neon:
        condition: service_completed_successfully
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.postiz-postiz-s1wlfw-41-web.rule=Host(`social.claro.vn`)
      - traefik.http.routers.postiz-postiz-s1wlfw-41-web.entrypoints=web
      - traefik.http.services.postiz-postiz-s1wlfw-41-web.loadbalancer.server.port=5000
      - traefik.http.routers.postiz-postiz-s1wlfw-41-web.service=postiz-postiz-s1wlfw-41-web
      - traefik.http.routers.postiz-postiz-s1wlfw-41-web.middlewares=redirect-to-https@file
      - traefik.http.routers.postiz-postiz-s1wlfw-41-websecure.rule=Host(`social.claro.vn`)
      - traefik.http.routers.postiz-postiz-s1wlfw-41-websecure.entrypoints=websecure
      - traefik.http.services.postiz-postiz-s1wlfw-41-websecure.loadbalancer.server.port=5000
      - traefik.http.routers.postiz-postiz-s1wlfw-41-websecure.service=postiz-postiz-s1wlfw-41-websecure
      - traefik.http.routers.postiz-postiz-s1wlfw-41-websecure.tls.certresolver=letsencrypt
      - traefik.enable=true
    networks:
      - dokploy-network
      - default
  sync-to-neon:
    image: postgres:17-alpine
    restart: no
    command: |
      sh -c "echo 'Syncing all data from local postiz-postgres to Neon...' && pg_dump -h postiz-postgres -U ${DB_USER} -d ${DB_NAME} --data-only --inserts --on-conflict-do-nothing -t '\"Organization\"' -t '\"User\"' -t '\"UserOrganization\"' -t '\"Integration\"' -t '\"Subscription\"' -t '\"Customer\"' -t '\"Media\"' -t '\"Post\"' | psql 'postgres://neondb_owner:npg_XIk9FK6qiZNT@ep-delicate-hill-a1ayc57p.ap-southeast-1.aws.neon.tech/postiz?sslmode=require' && echo 'Sync complete!'"
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    depends_on:
      postiz-postgres:
        condition: service_healthy
  postiz-postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER} -d ${DB_NAME}
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  postiz-redis:
    image: redis:7.2
    restart: always
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis-data:/data
  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    restart: always
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes:
      - temporal-es-data:/usr/share/elasticsearch/data
  temporal-postgresql:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_PASSWORD: ${TEMPORAL_PASSWORD}
      POSTGRES_USER: ${TEMPORAL_USER}
    volumes:
      - temporal-pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${TEMPORAL_USER}
      interval: 10s
      timeout: 5s
      retries: 5
  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: always
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_started
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${TEMPORAL_USER}
      - POSTGRES_PWD=${TEMPORAL_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgresql
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    healthcheck:
      test:
        - CMD-SHELL
        - tctl --address $(hostname -i):7233 --namespace default workflow list > /dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
volumes:
  postgres-volume: null
  postiz-redis-data: null
  postiz-config: null
  postiz-uploads: null
  temporal-es-data: null
  temporal-pg-data: null
networks:
  dokploy-network:
    external: true
